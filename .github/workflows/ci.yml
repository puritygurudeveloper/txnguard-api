name: ci

on:
  push: { branches: [main] }
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ["21", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Build, test and enforce the coverage gate
        run: ./mvnw -B verify
      - uses: actions/upload-artifact@v4
        if: matrix.java == '21'
        with:
          name: jacoco-report
          path: target/site/jacoco/

  container:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: maven }
      - run: ./mvnw -B -DskipTests package
      - name: Build the image and check it actually starts
        run: |
          docker build -t txnguard:ci .
          docker run -d --name txnguard -p 8080:8080 txnguard:ci
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
              echo "service healthy"; exit 0
            fi
            sleep 2
          done
          echo "service never became healthy"; docker logs txnguard; exit 1
